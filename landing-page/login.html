<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | CampusLaunch</title>

    <link rel="stylesheet" href="style.css">

</head>

<body class="login-page">

    <div class="login-container">

        <!-- LEFT SIDE -->

        <div class="login-info">

            <div class="login-logo">
                Campus<span>Launch</span>
            </div>

            <h1>
                Welcome Back.
            </h1>

            <p>
                Continue your journey and discover internships,
                hackathons and opportunities built for students.
            </p>

            <div class="login-features">

                <div>
                    <span>✓</span>
                    Discover internships
                </div>

                <div>
                    <span>✓</span>
                    Join exciting hackathons
                </div>

                <div>
                    <span>✓</span>
                    Build your career
                </div>

            </div>

        </div>


        <!-- RIGHT SIDE -->

        <div class="login-card">

            <h2>Log in</h2>

            <p class="login-subtitle">
                Enter your details to continue
            </p>


            <form id="loginForm">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >


                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                >


                <div class="login-options">

                    <label class="remember">
                        <input type="checkbox">
                        Remember me
                    </label>

                    <a href="#">
                        Forgot password?
                    </a>

                </div>


                <button type="submit" class="login-submit">
                    Log in
                </button>

            </form>


            <p class="create-account">
                Don't have an account?
                <a href="signup.html">
                    Get Started
                </a>
            </p>

        </div>

    </div>
<script>
document.getElementById("loginForm").addEventListener("submit", function(event) {
    event.preventDefault();

    const email = document.getElementById("email").value.trim().toLowerCase();
    const password = document.getElementById("password").value;

    const savedAccount = localStorage.getItem("campusLaunchAccount");

    if (!savedAccount) {
        alert("No account found. Please create an account first.");
        return;
    }

    const account = JSON.parse(savedAccount);

    if (email === account.email && password === account.password) {

        alert("Login successful!");

        window.location.href = "index.html";

    } else {

        alert("Invalid email or password. Please try again.");
    }
});
</script>
</body>

</html>
